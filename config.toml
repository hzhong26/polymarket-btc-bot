[venue]
# "international" or "us"
venue_type = "international"

[venue.international]
clob_url = "https://clob.polymarket.com"
gamma_url = "https://gamma-api.polymarket.com"
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/"
chain_id = 137
# proxy_wallet = "0xYOUR_PROXY_WALLET"

[venue.us]
api_url = "https://api.polymarket.com"
# api_key loaded from .env

[price_feeds]
# Primary: Chainlink USD price feeds (resolution-aligned, Polygon)
chainlink_rpc_url = "https://polygon-bor-rpc.publicnode.com"
chainlink_btc_usd_address = "0xc907E116054Ad103354f2D350FD2514433D57F6f"
chainlink_eth_usd_address = "0xF9680D99D6C9589e2a93a78A04A279e509205945"
chainlink_sol_usd_address = "0x10C8264C0935b3B9870013e4e1405290b27F15b4"
chainlink_xrp_usd_address = "0x785ba89291f676b5386652eB12b30cF361020694"
# Use self-captured reference price for entry when official price_to_beat is unavailable.
captured_reference_for_entry = true
# Gate continuous Chainlink polling (default off to save RPC quota).
# One-shot calls at window open are always available when captured_reference_for_entry=true.
chainlink_continuous_enabled = false

# Cross-check feeds
binance_ws_url = "wss://stream.binance.us:9443/stream?streams=btcusdt@ticker/ethusdt@ticker/xrpusdt@ticker/solusdt@ticker"
coinbase_url = "https://api.coinbase.com/v2/prices/BTC-USD/spot"
coingecko_url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"
cryptocompare_url = "https://min-api.cryptocompare.com/data/price?fsym=BTC&tsyms=USD"
# Optional: CryptoCompare now requires an API key. Get one free at
# https://www.cryptocompare.com/cryptopian/api-keys
# If omitted, CryptoCompare feeds are silently disabled.
# cryptocompare_api_key = "YOUR_KEY_HERE"

poll_interval_ms = 3000
staleness_threshold_ms = 10000
# CoinGecko is polled slower; allow a longer freshness window for this source.
coingecko_staleness_threshold_ms = 45000
anomaly_deviation_pct = "2.0"
# Require at least two fresh, non-anomalous sources before publishing an aggregate.
min_sources_per_asset = 2

[trading]
scan_interval_ms = 30000
tick_interval_ms = 500
edge_threshold = "0.11"
kelly_fraction = "0.20"
uncertainty_haircut_max = "0.90"
latency_penalty = "0.005"
# Restrict scanner universe to requested crypto assets.
market_tags = ["bitcoin", "ethereum", "xrp", "solana"]
# Scan 5-minute and 15-minute windows.
market_duration_max_secs = 900
min_confidence = "0.80"
max_spread_ratio = "0.01"
min_liquidity = "1000"
min_time_to_expiry_secs = 120
calibration_min_samples = 30
# Paper-mode bankroll used for Kelly/risk when running with --paper.
paper_bankroll_usdc = "10000"
# Volatility estimation window in seconds (default 300 = 5 minutes).
vol_window_secs = 300
# EWMA decay factor for volatility (0.94 = RiskMetrics standard).
# Higher = more weight on history; lower = faster reaction to new data.
ewma_lambda = 0.94
# Polymarket dynamic fee: fee_per_share = fee_rate × (p × (1-p))^fee_exponent
fee_rate = "0.25"
fee_exponent = 2
# Reject trades with net edge above this cap (suspiciously large edges lose money).
max_net_edge = "0.20"
# YES-side trades must clear threshold × this multiplier (YES underperforms historically).
yes_edge_threshold_mult = "1.2"
# NO-side trades must clear threshold × this multiplier (NO side 43.1% WR in Run 46).
no_edge_threshold_mult = "1.2"
# Dashboard controls
dashboard_enabled = true
dashboard_live_interval_ms = 5000

[trading.asset_params.btc]
edge_threshold_mult = "1.0"
uncertainty_mult = "1.0"
ewma_lambda = 0.88

[trading.asset_params.eth]
edge_threshold_mult = "1.0"
uncertainty_mult = "1.0"

[trading.asset_params.xrp]
edge_threshold_mult = "1.5"    # effective threshold: 0.165
uncertainty_mult = "1.0"
ewma_lambda = 0.94             # Run 46: 0.94 had best Brier (0.2336)

[trading.asset_params.sol]
edge_threshold_mult = "1.8"    # effective threshold: 0.198 (was 2.5, blocked all trades)
uncertainty_mult = "1.0"
ewma_lambda = 0.90             # faster EWMA reaction for noisier asset

[risk]
max_position_usdc = "1000"
max_total_exposure = "4000"
max_drawdown_pct = "0.50"
cooldown_after_loss_ms = 60000
max_consecutive_losses = 3
max_open_orders = 10
max_quote_age_ms = 5000
ws_disconnect_action = "cancel-all"

[logging]
level = "info"
format = "pretty"
metrics_port = 9090
dashboard_port = 8080

[logging.jsonl]
enabled = true
dir = "logs"
flush_interval_ms = 1000
channel_capacity = 8192
no_trade_sample_rate = 0.01
orderbook_depth_levels = 3
gzip_on_roll = false
prune_days = 0
